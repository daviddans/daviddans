<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="132" viewBox="0 0 1000 132" fill="none">
  <!-- pie de página: cierre de sesión + el error rojo de siempre.
       Todo va dentro de un clip para que la línea del degradado no
       sobresalga por las esquinas redondeadas. -->
  <defs>
    <linearGradient id="eof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F38BA8"/>
      <stop offset=".5" stop-color="#CBA6F7"/>
      <stop offset="1" stop-color="#7DCFFF"/>
    </linearGradient>
    <clipPath id="panel">
      <rect x="1" y="1" width="998" height="130" rx="26"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="998" height="130" rx="26" fill="#1A1B26"/>

  <g clip-path="url(#panel)">
    <!-- línea de degradado del final, pegada al borde inferior -->
    <rect x="0" y="126" width="1000" height="6" fill="url(#eof)"/>

    <!-- comando de salida -->
    <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="30" font-weight="bold" x="48" y="56">
      <tspan fill="#BB9AF7">daviddans</tspan><tspan fill="#C0CAF5">@</tspan><tspan fill="#7AA2F7">arch</tspan><tspan fill="#565F89">:~$</tspan><tspan fill="#9ECE6A"> exit 0</tspan>
    </text>
    <!-- cursor detrás de "exit 0" (el texto medido acaba en x=480) -->
    <rect x="487" y="33" width="15" height="31" fill="#BB9AF7">
      <animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" fill="#7AA2F7" x="48" y="90">logout</text>
    <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#565F89" x="126" y="90">· la sesión sigue abierta en otro sitio: escríbeme</text>

    <!-- el error de siempre, en su propia columna para que no pise nada -->
    <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" font-weight="bold" text-anchor="end" fill="#F38BA8" x="952" y="52">[ERROR] social_life:</text>
    <text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="19" text-anchor="end" fill="#F38BA8" x="952" y="80">process not found</text>
    <rect x="957" y="66" width="13" height="20" fill="#F38BA8">
      <animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
