<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" fill="none">
  <!-- único separador del perfil: onda doble + burbujas pixel.
       viewBox bajo (900×56) para que sea más estrecho; en el README va
       con width="100%", así que ocupa siempre todo el ancho. -->
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F38BA8"/><stop offset=".5" stop-color="#CBA6F7"/>
      <stop offset="1" stop-color="#7DCFFF"/>
    </linearGradient>
  </defs>
  <path d="M0 30 Q 75 10, 150 30 T 300 30 T 450 30 T 600 30 T 750 30 T 900 30" stroke="url(#w)" stroke-width="4" fill="none" stroke-linecap="round">
    <animate attributeName="d" dur="2.4s" repeatCount="indefinite"
      values="M0 30 Q 75 10, 150 30 T 300 30 T 450 30 T 600 30 T 750 30 T 900 30;
              M0 30 Q 75 50, 150 30 T 300 30 T 450 30 T 600 30 T 750 30 T 900 30;
              M0 30 Q 75 10, 150 30 T 300 30 T 450 30 T 600 30 T 750 30 T 900 30"/>
  </path>
  <path d="M0 41 Q 75 26, 150 41 T 300 41 T 450 41 T 600 41 T 750 41 T 900 41" stroke="#7AA2F7" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".5">
    <animate attributeName="d" dur="3.1s" repeatCount="indefinite"
      values="M0 41 Q 75 26, 150 41 T 300 41 T 450 41 T 600 41 T 750 41 T 900 41;
              M0 41 Q 75 56, 150 41 T 300 41 T 450 41 T 600 41 T 750 41 T 900 41;
              M0 41 Q 75 26, 150 41 T 300 41 T 450 41 T 600 41 T 750 41 T 900 41"/>
  </path>
  <g>
    <rect x="200" y="26" width="6" height="6" fill="#F38BA8">
      <animate attributeName="y" values="26;2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="460" y="22" width="5" height="5" fill="#7DCFFF">
      <animate attributeName="y" values="22;3" dur="2.6s" begin=".6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.6s" begin=".6s" repeatCount="indefinite"/>
    </rect>
    <rect x="700" y="28" width="6" height="6" fill="#CBA6F7">
      <animate attributeName="y" values="28;4" dur="2.3s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.3s" begin="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
