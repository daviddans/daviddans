<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" shape-rendering="crispEdges">
  <!-- 💾 disquete · melocotón con persiana oscura y etiqueta de colores -->
  <rect x="6" y="6" width="60" height="60" fill="#FAB387"/>
  <rect x="24" y="6" width="24" height="18" fill="#1A1B26"/>
  <rect x="36" y="6" width="6" height="12" fill="#FAB387"/>
  <rect x="12" y="30" width="48" height="30" fill="#FFFFFF"/>
  <rect x="18" y="38" width="36" height="6" fill="#7AA2F7">
    <animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="18" y="48" width="24" height="6" fill="#CBA6F7">
    <animate attributeName="opacity" values="1;.35;1" dur="1.6s" begin=".5s" repeatCount="indefinite"/>
  </rect>
</svg>
