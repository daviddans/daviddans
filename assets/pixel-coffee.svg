<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" shape-rendering="crispEdges">
  <!-- ☕ café pixel · vapor animado, melocotón -->
  <g fill="#FAB387">
    <rect x="14" y="30" width="36" height="26"/>
  </g>
  <rect x="50" y="36" width="6" height="6" fill="#FAB387"/>
  <rect x="56" y="42" width="6" height="6" fill="#FAB387"/>
  <rect x="50" y="48" width="6" height="6" fill="#FAB387"/>
  <rect x="20" y="36" width="4" height="4" fill="#1A1B26"/>
  <rect x="38" y="36" width="4" height="4" fill="#1A1B26"/>
  <rect x="8" y="58" width="48" height="6" fill="#CBA6F7"/>
  <g fill="#E6E9FF">
    <rect x="22" y="14" width="6" height="6">
      <animate attributeName="y" values="14;4" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="34" y="18" width="6" height="6">
      <animate attributeName="y" values="18;8" dur="2.2s" begin=".5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.2s" begin=".5s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="10" width="6" height="6">
      <animate attributeName="y" values="10;2" dur="2.6s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.6s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
